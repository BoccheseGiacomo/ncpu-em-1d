[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncpu-em-1d"
version = "0.1.0"
description = "A self-contained one-dimensional programmable neural cellular automaton"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pillow>=10.1,<13",
    "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = ["black>=24,<27", "flake8>=7,<8", "pytest>=8,<9"]
notebook = ["ipykernel>=6.29,<7", "jupyterlab>=4.2,<5", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
